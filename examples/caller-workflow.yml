# Copy this file into any other repo as .github/workflows/ai_code_review.yml
# to get the same AI code review powered by r0hann/code-reviewer.
#
# Setup in the target repo:
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      Add ONE of: GROQ_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY,
#      GOOGLE_API_KEY, OPENROUTER_API_KEY. The provider is auto-detected
#      from whichever key you set - no other config needed.
#   2. Commit this file as .github/workflows/ai_code_review.yml
#   3. Open a PR - the review comment will appear automatically.

name: Automated AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  call-reviewer:
    uses: r0hann/code-reviewer/.github/workflows/ai_code_review.yml@main
    permissions:
      pull-requests: write
      contents: read
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    # Optional overrides - only needed if you want a non-default model,
    # or have more than one provider key set and want to force one:
    # with:
    #   llm_provider: "anthropic"       # forces a provider when multiple keys are set
    #   groq_model: "llama-3.1-8b-instant"
    #   anthropic_model: "claude-haiku-4-5-20251001"
    #   openai_model: "gpt-4o-mini"
    #   google_model: "gemini-1.5-flash"
    #   openrouter_model: "some/model-id"   # required if using openrouter, no default
